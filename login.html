<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Aurex Capital</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071426, #102441);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 38px 30px;
      background: #102039;
      border: 1px solid rgba(217,181,104,0.35);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .logo {
      text-align: center;
      color: #d9b568;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aebbd0;
      font-size: 14px;
      margin-bottom: 30px;
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 7px;
      border: 1px solid #34445c;
      background: #071426;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #d9b568;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: #d9b568;
      color: #071426;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #f0d28c;
    }

    .notice {
      margin-top: 18px;
      padding: 12px;
      background: rgba(217,181,104,0.08);
      border: 1px solid rgba(217,181,104,0.2);
      border-radius: 7px;
      color: #d9b568;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .links {
      text-align: center;
      margin-top: 23px;
      font-size: 14px;
      line-height: 2;
    }

    a {
      color: #d9b568;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .home-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #aebbd0;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="login-card">
    <div class="logo">AUREX CAPITAL</div>

    <p class="subtitle">Your financial platform demonstration</p>

    <h1>Welcome Back</h1>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter a demo password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Explore Demo</button>
    </form>

    <div class="notice">
      DEMO ONLY: This form does not authenticate users or create
      sessions. Do not enter a real password or sensitive information.
    </div>

    <div class="links">
      New to Aurex Capital?
      <a href="register.html">Explore Registration</a>
    </div>

    <a class="home-link" href="index.html">← Back to Homepage</a>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();
      alert("This is a demonstration login form. Real authentication is not enabled.");
    });
  </script>

</body>
</html>
